<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNDOIF -- Shell Network Detection</title>
    <style>
        :root {
            --navy: #1a2b4c;
            --blue: #457b9d;
            --light-blue: #a8dadc;
            --bg: #f5f7fa;
            --red: #e63946;
            --green: #2a9d8f;
            --border: #d8dde3;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: #1d2330;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(26, 43, 76, 0.08);
            padding: 40px;
            max-width: 480px;
            width: 100%;
        }
        .badge {
            display: inline-block;
            background: var(--light-blue);
            color: var(--navy);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        h1 {
            color: var(--navy);
            margin: 0 0 8px;
            font-size: 28px;
        }
        p.subtitle {
            color: #5a6472;
            margin: 0 0 28px;
            line-height: 1.5;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #5a6472;
            margin-bottom: 6px;
        }
        input[type=text] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.15s;
        }
        input[type=text]:focus {
            outline: none;
            border-color: var(--blue);
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: var(--blue); }
        .error {
            background: #fdecea;
            color: var(--red);
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">SNDOIF</span>
        <h1>Shell Network Detection</h1>
        <p class="subtitle">Enter a UK Companies House company number to check ownership,
           sanctions exposure, and network connections against the known entity sample.</p>
        <form method="POST" action="/search">
            <label for="company_number">Company number</label>
            <input type="text" id="company_number" name="company_number" placeholder="e.g. 09446231" required>
            <button type="submit">Run analysis</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
