<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNDOIF -- Shell Network Detection</title>
    <style>
        :root { --navy: #1a2b4c; --blue: #457b9d; --light-blue: #a8dadc; --bg: #f5f7fa; --red: #e63946; --border: #d8dde3; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: #1d2330; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(26, 43, 76, 0.08); padding: 40px; max-width: 480px; width: 100%; }
        .badge { display: inline-block; background: var(--light-blue); color: var(--navy); font-size: 12px; font-weight: 600; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
        h1 { color: var(--navy); margin: 0 0 8px; font-size: 28px; }
        p.subtitle { color: #5a6472; margin: 0 0 28px; line-height: 1.5; }
        label { display: block; font-size: 13px; font-weight: 600; color: #5a6472; margin-bottom: 6px; }
        input[type=text] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; }
        input[type=text]:focus { outline: none; border-color: var(--blue); }
        button { width: 100%; margin-top: 16px; padding: 12px; font-size: 16px; font-weight: 600; background: var(--navy); color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: var(--blue); }
        .error { background: #fdecea; color: var(--red); padding: 12px 14px; border-radius: 8px; margin-top: 16px; font-size: 14px; }
        .hint { font-size: 12px; color: #8a92a0; margin-top: 8px; }
        @media (max-width: 480px) { .card { padding: 28px 20px; } h1 { font-size: 24px; } }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">SNDOIF</span>
        <h1>Shell Network Detection</h1>
        <p class="subtitle">Search for a UK company by name to check ownership,
           sanctions exposure, and network connections against the known entity sample.</p>
        <form method="POST" action="/search-by-name">
            <label for="query">Company name</label>
            <input type="text" id="query" name="query" placeholder="e.g. Deliveroo" required>
            <button type="submit">Search</button>
        </form>
        <p class="hint">Know the exact Companies House number? <a href="#" onclick="document.getElementById('num-form').style.display='block'; return false;">Search by number instead</a></p>
        <form method="POST" action="/search" id="num-form" style="display:none; margin-top: 10px;">
            <input type="text" name="company_number" placeholder="e.g. 09446231" required>
            <button type="submit">Analyze</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
