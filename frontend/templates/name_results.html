<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search results -- SNDOIF</title>
    <style>
        :root { --navy: #1a2b4c; --blue: #457b9d; --bg: #f5f7fa; --border: #d8dde3; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 24px; }
        .wrap { max-width: 600px; margin: 0 auto; }
        .back { display: inline-block; color: var(--blue); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
        h1 { color: var(--navy); font-size: 22px; }
        .result-card {
            background: white; border-radius: 10px; box-shadow: 0 2px 10px rgba(26,43,76,0.08);
            padding: 16px 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .result-name { font-weight: 600; color: var(--navy); }
        .result-meta { font-size: 13px; color: #5a6472; margin-top: 2px; }
        .status-active { color: #2a9d8f; }
        .status-dissolved { color: #e63946; }
        button {
            padding: 8px 16px; font-size: 13px; font-weight: 600; background: var(--navy);
            color: white; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap;
        }
        .empty { color: #5a6472; text-align: center; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="/">&larr; New search</a>
        <h1>Results for "{{ query }}"</h1>

        {% if results %}
            {% for r in results %}
            <div class="result-card">
                <div>
                    <div class="result-name">{{ r.title }}</div>
                    <div class="result-meta">
                        {{ r.company_number }} &middot;
                        <span class="{% if r.company_status == 'active' %}status-active{% else %}status-dissolved{% endif %}">{{ r.company_status }}</span>
                    </div>
                </div>
                <form method="POST" action="/search">
                    <input type="hidden" name="company_number" value="{{ r.company_number }}">
                    <button type="submit">Analyze</button>
                </form>
            </div>
            {% endfor %}
        {% else %}
            <p class="empty">No companies found matching "{{ query }}".</p>
        {% endif %}
    </div>
</body>
</html>
